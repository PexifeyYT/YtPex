<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>YtPex — Liquid Glass</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-1: #0b0518;
    --bg-2: #14093a;
    --bg-3: #1b0a4a;
    --bg-4: #050211;
    --accent-hue: 270;
    --accent-1: oklch(0.72 0.18 var(--accent-hue));
    --accent-2: oklch(0.78 0.16 calc(var(--accent-hue) + 40));
    --accent-3: oklch(0.82 0.14 calc(var(--accent-hue) - 50));
    --glass-tint: 255, 255, 255;
    --glass-alpha: 0.07;
    --glass-stroke: rgba(255,255,255,0.18);
    --glass-blur: 32px;
    --text-1: rgba(255,255,255,0.96);
    --text-2: rgba(255,255,255,0.72);
    --text-3: rgba(255,255,255,0.5);
    --ease-fluid: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-bubble: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text-1);
    background: #050211;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, oklch(0.35 0.18 280 / 0.7), transparent 60%),
      radial-gradient(ellipse 70% 70% at 90% 30%, oklch(0.32 0.16 320 / 0.55), transparent 60%),
      radial-gradient(ellipse 80% 80% at 50% 100%, oklch(0.3 0.15 240 / 0.7), transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 30%, var(--bg-3) 55%, var(--bg-4) 100%);
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: 0.5;
    pointer-events: none;
    z-index: -1;
    mix-blend-mode: overlay;
  }

  /* ---- Bubbles ---- */
  .bubble-field {
    position: fixed; inset: -10vh -10vw;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 28%,
      rgba(255,255,255,0.22) 0%,
      rgba(255,255,255,0.06) 25%,
      oklch(0.6 0.18 var(--b-hue, 280) / 0.18) 55%,
      oklch(0.4 0.2 var(--b-hue, 280) / 0.05) 100%);
    box-shadow:
      inset -8px -12px 30px oklch(0.3 0.2 var(--b-hue, 280) / 0.25),
      inset 8px 12px 30px rgba(255,255,255,0.08),
      0 0 60px oklch(0.6 0.18 var(--b-hue, 280) / 0.15);
    filter: blur(0.5px);
    animation: drift var(--b-dur, 40s) var(--ease-fluid) infinite;
    opacity: var(--b-opacity, 0.55);
  }
  .bubble::after {
    content: '';
    position: absolute;
    top: 12%; left: 18%;
    width: 28%; height: 22%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.55), transparent 70%);
    filter: blur(2px);
  }
  @keyframes drift {
    0%, 100% { transform: translate(0,0) scale(1); }
    25% { transform: translate(40px, -30px) scale(1.05); }
    50% { transform: translate(-20px, -60px) scale(0.95); }
    75% { transform: translate(30px, -40px) scale(1.02); }
  }

  /* ---- Glass primitive ---- */
  .glass {
    background: linear-gradient(135deg,
      rgba(var(--glass-tint), calc(var(--glass-alpha) + 0.04)),
      rgba(var(--glass-tint), var(--glass-alpha)));
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border: 1px solid var(--glass-stroke);
    border-radius: 24px;
    position: relative;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -1px 0 rgba(0,0,0,0.18);
  }
  .glass::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg,
      rgba(255,255,255,0.10) 0%,
      transparent 30%,
      transparent 70%,
      rgba(255,255,255,0.05) 100%);
    pointer-events: none;
  }

  /* ---- Layout ---- */
  .app {
    position: relative;
    z-index: 2;
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 32px 120px;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 36px;
  }
  .brand {
    display: flex; align-items: center; gap: 14px;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.02em;
  }
  .brand-mark {
    width: 36px; height: 36px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display: grid; place-items: center;
    box-shadow:
      0 4px 14px oklch(0.5 0.18 var(--accent-hue) / 0.5),
      inset 0 1px 0 rgba(255,255,255,0.4);
    position: relative;
  }
  .brand-mark::after {
    content: '';
    position: absolute; top: 4px; left: 6px;
    width: 14px; height: 8px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.6), transparent 70%);
  }
  .brand-name { font-weight: 600; }
  .brand-name span { color: var(--text-3); font-weight: 400; margin-left: 8px; font-size: 13px; }

  .top-actions { display: flex; gap: 10px; }
  .pill-btn {
    height: 40px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid var(--glass-stroke);
    background: rgba(var(--glass-tint), 0.06);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    color: var(--text-1);
    font: inherit; font-size: 13px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer;
    transition: all 0.5s var(--ease-fluid);
    position: relative; overflow: hidden;
  }
  .pill-btn:hover {
    background: rgba(var(--glass-tint), 0.12);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.08);
  }
  .pill-btn svg { width: 15px; height: 15px; opacity: 0.85; }

  /* ---- Search ---- */
  .search-wrap {
    position: relative;
    margin: 0 auto 16px;
    max-width: 820px;
  }
  .search {
    height: 72px;
    border-radius: 999px;
    padding: 0 22px 0 26px;
    display: flex; align-items: center; gap: 14px;
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.4),
      0 0 0 1px rgba(255,255,255,0.04),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -1px 0 rgba(0,0,0,0.2),
      0 0 80px oklch(0.6 0.18 var(--accent-hue) / 0.2);
    transition: box-shadow 0.6s var(--ease-fluid), transform 0.4s var(--ease-fluid);
    position: relative;
  }
  .search:focus-within {
    box-shadow:
      0 24px 72px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.12),
      inset 0 1px 0 rgba(255,255,255,0.5),
      0 0 120px oklch(0.7 0.2 var(--accent-hue) / 0.35);
  }
  .search-icon { width: 22px; height: 22px; opacity: 0.7; flex-shrink: 0; }
  .search input {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: var(--text-1); font: inherit; font-size: 19px;
    letter-spacing: -0.01em;
    height: 100%;
  }
  .search input::placeholder { color: rgba(255,255,255,0.45); }
  .search-go {
    height: 52px;
    padding: 0 24px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: white; font: inherit; font-weight: 600; font-size: 14px;
    cursor: pointer;
    box-shadow:
      0 6px 18px oklch(0.5 0.18 var(--accent-hue) / 0.5),
      inset 0 1px 0 rgba(255,255,255,0.5);
    transition: all 0.4s var(--ease-fluid);
    display: flex; align-items: center; gap: 8px;
  }
  .search-go:hover { transform: translateY(-1px) scale(1.02); }
  .search-go:active { transform: scale(0.98); }

  /* Ripple */
  .ripple-layer { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; overflow: hidden; }
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.03);
    animation: rippleOut 1.4s var(--ease-fluid) forwards;
    pointer-events: none;
  }
  @keyframes rippleOut {
    0% { width: 4px; height: 4px; opacity: 0.9; transform: translate(-50%,-50%) scale(0.6); }
    100% { width: 220px; height: 220px; opacity: 0; transform: translate(-50%,-50%) scale(1); }
  }

  /* ---- Paste row ---- */
  .paste-row {
    max-width: 820px;
    margin: 0 auto 48px;
    display: flex; gap: 12px; align-items: center;
  }
  .paste-input {
    flex: 1;
    height: 48px;
    border-radius: 999px;
    padding: 0 22px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    color: var(--text-1); font: inherit; font-size: 14px;
    outline: none;
    transition: all 0.5s var(--ease-fluid);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .paste-input::placeholder { color: rgba(255,255,255,0.35); }
  .paste-input:focus {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.28);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.2),
      0 0 0 4px oklch(0.7 0.18 var(--accent-hue) / 0.18),
      0 0 40px oklch(0.7 0.18 var(--accent-hue) / 0.25);
  }
  .paste-btn {
    height: 48px;
    padding: 0 22px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    color: var(--text-1); font: inherit; font-weight: 500; font-size: 13px;
    cursor: pointer;
    transition: all 0.4s var(--ease-fluid);
  }
  .paste-btn:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }

  /* ---- Player ---- */
  .player-stage {
    margin: 0 auto 56px;
    max-width: 1080px;
    transition: all 0.7s var(--ease-fluid);
  }
  .player-glass {
    border-radius: 32px;
    padding: 20px;
    background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
    backdrop-filter: blur(60px) saturate(200%);
    -webkit-backdrop-filter: blur(60px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow:
      0 40px 120px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.05),
      inset 0 1px 0 rgba(255,255,255,0.3);
    position: relative;
  }
  .iridescent {
    position: absolute; inset: -2px;
    border-radius: inherit;
    padding: 2px;
    background: conic-gradient(from 0deg,
      oklch(0.75 0.2 280 / 0.6),
      oklch(0.75 0.2 200 / 0.6),
      oklch(0.75 0.2 320 / 0.6),
      oklch(0.75 0.2 240 / 0.6),
      oklch(0.75 0.2 280 / 0.6));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 12s linear infinite;
    opacity: 0.65;
    pointer-events: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .player-screen {
    aspect-ratio: 16/9;
    border-radius: 20px;
    background: #000;
    overflow: hidden;
    position: relative;
  }
  .player-screen .thumb-art { position: absolute; inset: 0; }
  .player-controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 16px 22px;
    background: linear-gradient(0deg, rgba(0,0,0,0.7), transparent);
    display: flex; align-items: center; gap: 14px;
    color: white;
  }
  .pc-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: grid; place-items: center;
    cursor: pointer;
    color: white;
    transition: all 0.3s var(--ease-fluid);
  }
  .pc-btn:hover { background: rgba(255,255,255,0.22); transform: scale(1.06); }
  .pc-btn svg { width: 18px; height: 18px; }
  .pc-scrub {
    flex: 1; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.18);
    position: relative; overflow: hidden;
  }
  .pc-scrub-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 32%;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    border-radius: inherit;
    box-shadow: 0 0 12px oklch(0.7 0.18 var(--accent-hue) / 0.8);
  }
  .pc-time { font: 500 12px 'JetBrains Mono', monospace; opacity: 0.85; min-width: 84px; text-align: right; letter-spacing: 0.02em; }

  .player-meta {
    padding: 22px 12px 8px;
    display: flex; justify-content: space-between; gap: 28px; align-items: flex-start;
  }
  .player-meta h2 { margin: 0 0 6px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .player-meta .sub { color: var(--text-2); font-size: 13px; display: flex; gap: 10px; align-items: center; }
  .player-meta .sub .dot { width: 3px; height: 3px; background: var(--text-3); border-radius: 50%; }

  /* ---- Download pills ---- */
  .dl-row { display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .dl-pill {
    height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    color: var(--text-1); font: inherit; font-weight: 500; font-size: 13px;
    display: inline-flex; align-items: center; gap: 10px;
    cursor: pointer;
    transition: all 0.45s var(--ease-fluid);
    position: relative; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .dl-pill .fmt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    padding: 3px 7px;
    border-radius: 6px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.12);
    letter-spacing: 0.05em;
  }
  .dl-pill:hover {
    background: rgba(255,255,255,0.14);
    transform: translateY(-2px);
    box-shadow:
      0 12px 32px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.3),
      0 0 36px oklch(0.7 0.18 var(--accent-hue) / 0.3);
  }
  .dl-pill .liquid-burst {
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at var(--cx,50%) var(--cy,50%), oklch(0.75 0.2 var(--accent-hue) / 0.55), transparent 60%);
    opacity: 0; pointer-events: none;
    transition: opacity 0.1s;
  }
  .dl-pill.bursting .liquid-burst { animation: burst 0.9s var(--ease-fluid) forwards; }
  @keyframes burst {
    0% { opacity: 0.9; transform: scale(0.4); }
    100% { opacity: 0; transform: scale(2.4); }
  }
  .dl-pill .progress {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 0%;
    background: linear-gradient(90deg, oklch(0.75 0.18 var(--accent-hue) / 0.35), oklch(0.8 0.18 calc(var(--accent-hue) + 40) / 0.35));
    border-radius: inherit;
    transition: width 0.3s linear;
    pointer-events: none;
  }
  .dl-pill .label-text { position: relative; z-index: 1; }

  /* ---- Grid ---- */
  .section-head { max-width: 1080px; margin: 0 auto 18px; padding: 0 6px; display: flex; justify-content: space-between; align-items: baseline; }
  .section-head h3 { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-3); }
  .section-head .count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-3); }

  .grid {
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
  }
  .card {
    border-radius: 22px;
    padding: 10px;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
    backdrop-filter: blur(24px) saturate(170%);
    -webkit-backdrop-filter: blur(24px) saturate(170%);
    border: 1px solid rgba(255,255,255,0.12);
    cursor: pointer;
    transition: transform 0.6s var(--ease-fluid), box-shadow 0.6s var(--ease-fluid), border-color 0.4s ease;
    position: relative;
    box-shadow:
      0 8px 24px rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.18);
    animation: rise 0.8s var(--ease-bubble) backwards;
  }
  .card:nth-child(1) { animation-delay: 0.02s; }
  .card:nth-child(2) { animation-delay: 0.06s; }
  .card:nth-child(3) { animation-delay: 0.10s; }
  .card:nth-child(4) { animation-delay: 0.14s; }
  .card:nth-child(5) { animation-delay: 0.18s; }
  .card:nth-child(6) { animation-delay: 0.22s; }
  .card:nth-child(7) { animation-delay: 0.26s; }
  .card:nth-child(8) { animation-delay: 0.30s; }
  .card:nth-child(9) { animation-delay: 0.34s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(20px) scale(0.96); filter: blur(8px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(255,255,255,0.22);
    box-shadow:
      0 20px 50px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.28),
      0 0 60px oklch(0.7 0.18 var(--accent-hue) / 0.18);
  }
  .card.active {
    border-color: oklch(0.8 0.18 var(--accent-hue) / 0.5);
    box-shadow:
      0 12px 36px rgba(0,0,0,0.4),
      0 0 0 1px oklch(0.8 0.18 var(--accent-hue) / 0.4),
      0 0 60px oklch(0.7 0.18 var(--accent-hue) / 0.3);
  }
  .thumb {
    aspect-ratio: 16/9;
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    background: #1a1030;
  }
  .thumb-art {
    width: 100%; height: 100%;
    position: relative;
  }
  .thumb-art::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.4) 0%, transparent 40%);
  }
  .thumb .duration {
    position: absolute; right: 8px; bottom: 8px;
    padding: 3px 7px;
    border-radius: 7px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font: 500 11px 'JetBrains Mono', monospace;
    color: white;
    border: 1px solid rgba(255,255,255,0.1);
    z-index: 2;
  }
  .thumb .play-hint {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    opacity: 0; transition: opacity 0.4s var(--ease-fluid);
    z-index: 2;
  }
  .card:hover .play-hint { opacity: 1; }
  .play-hint-circle {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.3);
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transform: scale(0.85);
    transition: transform 0.5s var(--ease-bubble);
  }
  .card:hover .play-hint-circle { transform: scale(1); }
  .play-hint-circle svg { width: 22px; height: 22px; margin-left: 3px; }

  .card-body { padding: 12px 6px 6px; }
  .card-title {
    font-size: 14px; font-weight: 500;
    line-height: 1.35; letter-spacing: -0.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    margin-top: 8px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-3);
  }
  .card-meta .channel { color: var(--text-2); }
  .card-meta .dot { width: 3px; height: 3px; background: var(--text-3); border-radius: 50%; }

  /* Shimmer sweep on card hover */
  .card::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.10) 50%, transparent 70%);
    background-size: 200% 100%;
    background-position: -100% 0;
    pointer-events: none;
    transition: background-position 1.2s var(--ease-fluid);
  }
  .card:hover::after { background-position: 200% 0; }

  /* ---- Modal ---- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(5,2,17,0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s var(--ease-fluid);
    z-index: 80;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -42%) scale(0.96);
    opacity: 0; pointer-events: none;
    width: min(560px, calc(100vw - 48px));
    max-height: calc(100vh - 80px);
    overflow: auto;
    border-radius: 28px;
    padding: 24px;
    background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.05));
    backdrop-filter: blur(60px) saturate(200%);
    -webkit-backdrop-filter: blur(60px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow:
      0 40px 120px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.35);
    transition: all 0.6s var(--ease-fluid);
    z-index: 90;
  }
  .modal.open {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1; pointer-events: auto;
  }
  .modal h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .modal .sub { color: var(--text-2); font-size: 13px; margin-bottom: 20px; }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--text-1); cursor: pointer;
    display: grid; place-items: center;
    transition: all 0.3s var(--ease-fluid);
  }
  .modal-close:hover { background: rgba(255,255,255,0.16); transform: rotate(90deg); }

  .nest {
    border-radius: 18px;
    padding: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    margin-bottom: 12px;
  }
  .nest h4 {
    margin: 0 0 12px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--text-3);
  }
  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block; margin-bottom: 6px;
    font-size: 12px; color: var(--text-2);
    font-weight: 500;
  }
  .field input[type=text] {
    width: 100%;
    height: 40px;
    border-radius: 12px;
    padding: 0 14px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04);
    color: var(--text-1); font: inherit; font-size: 13px;
    outline: none;
    transition: all 0.4s var(--ease-fluid);
  }
  .field input[type=text]:focus {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.28);
    box-shadow: 0 0 0 4px oklch(0.7 0.18 var(--accent-hue) / 0.18);
  }
  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px;
  }
  .switch-row .meta { flex: 1; }
  .switch-row .meta .name { font-size: 13.5px; font-weight: 500; }
  .switch-row .meta .desc { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .switch {
    width: 44px; height: 26px; border-radius: 999px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.14);
    position: relative; cursor: pointer;
    transition: all 0.5s var(--ease-fluid);
    flex-shrink: 0;
  }
  .switch.on {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 0 16px oklch(0.7 0.18 var(--accent-hue) / 0.5);
  }
  .switch::after {
    content: '';
    position: absolute; top: 2px; left: 2px;
    width: 20px; height: 20px; border-radius: 50%;
    background: white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    transition: all 0.5s var(--ease-fluid);
  }
  .switch.on::after { left: 20px; }

  .favi-row { display: flex; gap: 14px; align-items: center; }
  .favi-bubble {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%,
      rgba(255,255,255,0.4), rgba(255,255,255,0.05) 50%,
      oklch(0.5 0.2 var(--accent-hue) / 0.5));
    border: 1px solid rgba(255,255,255,0.2);
    display: grid; place-items: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 8px 24px rgba(0,0,0,0.3);
    flex-shrink: 0;
    font-weight: 700; font-size: 22px;
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .favi-choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .favi-choice {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    display: grid; place-items: center;
    cursor: pointer;
    transition: all 0.3s var(--ease-fluid);
    font-size: 16px;
  }
  .favi-choice:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
  .favi-choice.sel {
    border-color: oklch(0.8 0.18 var(--accent-hue) / 0.6);
    box-shadow: 0 0 0 2px oklch(0.8 0.18 var(--accent-hue) / 0.3);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 14px 22px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.22);
    color: var(--text-1);
    font-size: 13.5px; font-weight: 500;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none;
    transition: all 0.6s var(--ease-fluid);
    z-index: 100;
    display: flex; align-items: center; gap: 10px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .toast-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: oklch(0.78 0.18 150);
    box-shadow: 0 0 10px oklch(0.78 0.18 150 / 0.8);
  }

  /* History dropdown */
  .suggestions {
    position: absolute;
    left: 22px; right: 22px; top: calc(100% + 8px);
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.16);
    padding: 8px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transform: translateY(-6px);
    transition: all 0.4s var(--ease-fluid);
    z-index: 30;
  }
  .suggestions.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .sug-item {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    color: var(--text-2);
    cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: background 0.25s ease;
  }
  .sug-item:hover { background: rgba(255,255,255,0.08); color: var(--text-1); }
  .sug-item svg { width: 14px; height: 14px; opacity: 0.6; }

  /* Empty state */
  .empty {
    text-align: center;
    color: var(--text-2);
    padding: 60px 20px;
    max-width: 480px; margin: 0 auto;
  }
  .empty .e-orb {
    width: 100px; height: 100px; border-radius: 50%;
    margin: 0 auto 22px;
    background: radial-gradient(circle at 30% 25%,
      rgba(255,255,255,0.45), rgba(255,255,255,0.08) 30%,
      oklch(0.55 0.2 var(--accent-hue) / 0.5) 60%, transparent);
    box-shadow: inset 0 4px 12px rgba(255,255,255,0.2), 0 20px 60px oklch(0.55 0.2 var(--accent-hue) / 0.4);
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .empty h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.02em; }
  .empty p { margin: 0; font-size: 14px; color: var(--text-3); line-height: 1.55; }

  /* Loader */
  .loader-grid .card {
    pointer-events: none;
  }
  .skeleton {
    background: linear-gradient(90deg,
      rgba(255,255,255,0.04) 0%,
      rgba(255,255,255,0.10) 50%,
      rgba(255,255,255,0.04) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
    border-radius: 14px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Tabs in modal */
  .tabs {
    display: flex; gap: 4px;
    margin-bottom: 18px;
    padding: 4px;
    border-radius: 14px;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .tab-btn {
    flex: 1; height: 34px;
    border-radius: 10px;
    border: 0;
    background: transparent;
    color: var(--text-2);
    font: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer;
    transition: all 0.4s var(--ease-fluid);
  }
  .tab-btn.active {
    background: rgba(255,255,255,0.12);
    color: var(--text-1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
  }

  /* ---- LED "made by pexifey" sign ---- */
  .led-sign {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: oklch(0.85 0.2 25);
    text-shadow:
      0 0 4px oklch(0.7 0.25 25 / 0.95),
      0 0 12px oklch(0.6 0.28 25 / 0.7),
      0 0 28px oklch(0.55 0.3 25 / 0.5);
    padding: 6px 12px 6px 10px;
    border: 1px solid oklch(0.5 0.2 25 / 0.45);
    border-radius: 8px;
    background: oklch(0.18 0.05 25 / 0.3);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    box-shadow:
      inset 0 0 14px oklch(0.5 0.25 25 / 0.22),
      0 0 24px oklch(0.5 0.28 25 / 0.28);
    animation: ledFlicker 3.7s steps(1, end) infinite, ledJitter 0.16s steps(1, end) infinite;
    user-select: none;
    white-space: nowrap;
    position: relative;
  }
  .led-sign .led-dim { opacity: 0.35; animation: charDie 5.3s steps(1, end) infinite; }
  .led-sign .led-dead { opacity: 0.12; animation: charDead 4.1s steps(1, end) infinite; }
  .led-sign .led-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: oklch(0.72 0.28 25);
    box-shadow: 0 0 6px oklch(0.7 0.28 25 / 0.95), 0 0 12px oklch(0.6 0.3 25 / 0.6);
    animation: ledBlink 1.4s steps(1, end) infinite;
    flex-shrink: 0;
  }
  @keyframes ledFlicker {
    0%, 100% { opacity: 1; }
    1.5% { opacity: 0.3; }
    2% { opacity: 1; }
    14% { opacity: 1; }
    14.3% { opacity: 0.4; }
    14.8% { opacity: 1; }
    34% { opacity: 1; }
    34.4% { opacity: 0.2; }
    34.7% { opacity: 1; }
    35.1% { opacity: 0.55; }
    35.5% { opacity: 1; }
    60% { opacity: 1; }
    60.2% { opacity: 0.6; }
    60.5% { opacity: 1; }
    78% { opacity: 1; }
    78.4% { opacity: 0.25; }
    78.6% { opacity: 1; }
    91% { opacity: 1; }
    91.3% { opacity: 0.45; }
    91.6% { opacity: 1; }
  }
  @keyframes ledJitter {
    0% { transform: translate(0, 0); }
    25% { transform: translate(0.3px, -0.2px); }
    50% { transform: translate(-0.2px, 0.3px); }
    75% { transform: translate(0.2px, 0.1px); }
    100% { transform: translate(-0.1px, -0.2px); }
  }
  @keyframes charDie {
    0%, 100% { opacity: 0.35; }
    20% { opacity: 1; }
    20.3% { opacity: 0.3; }
    20.6% { opacity: 1; }
    21% { opacity: 0.35; }
    55% { opacity: 0.35; }
    55.4% { opacity: 1; }
    55.7% { opacity: 0.35; }
  }
  @keyframes charDead {
    0%, 100% { opacity: 0.12; }
    32% { opacity: 0.12; }
    32.3% { opacity: 0.9; }
    32.5% { opacity: 0.12; }
    72% { opacity: 0.12; }
    72.2% { opacity: 0.5; }
    72.4% { opacity: 0.12; }
  }
  @keyframes ledBlink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.18; }
  }
  .led-wrap {
    display: flex; justify-content: center;
    margin: -16px auto 22px;
    position: relative; z-index: 5;
  }

  @media (max-width: 720px) {
    .player-meta { flex-direction: column; }
    .dl-row { justify-content: flex-start; }
    .search { height: 60px; padding: 0 14px 0 18px; }
    .search input { font-size: 16px; }
    .search-go { padding: 0 18px; font-size: 13px; }
    .app { padding: 28px 18px 100px; }
  }
</style>
</head>
<body>

<div class="bubble-field" id="bubbleField"></div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
